<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Peaches, the part-poodle mascot of Gigapoo">
  <!-- 15 Nov 2026 peaches-2b: yellow with a black outline, big eyes, a big black nose and her tongue out (Mark: "I would like peaches to be yellow with a black outline its a better logo"); the white one is kept as peaches-2026-09-21-white.svg. Peaches, 21 Sep 2026: part poodle — the smart, talented mix Gigapoo is named for. One smart poodle with a mix of people she knows. Drawn as an outline from her photo: curly coat, dark nose, a spotted bandana, sitting. -->
  <g fill="#ffd21f" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- body, sitting -->
    <path d="M24 36 Q9 43 12 58 Q17 62 25 59 Q32 62 39 59 Q47 62 52 58 Q55 43 40 36 Z"/>
    <!-- fluff on the flanks -->
    <path d="M15 47 q2 -3 4 0 M13 53 q2 -3 4 0 M45 47 q2 -3 4 0 M47 53 q2 -3 4 0" fill="none" stroke-width="1.5"/>
    <!-- front legs -->
    <path d="M27 47 V58 M37 47 V58" fill="none"/>
    <!-- bandana, spotted -->
    <path d="M22 35 L42 35 L33 47 Z" fill="#fff"/>
    <circle cx="29.5" cy="38.5" r="1" fill="#d9482b" stroke="none"/><circle cx="35" cy="39.5" r="1" fill="#d9482b" stroke="none"/><circle cx="32.5" cy="43" r="1" fill="#d9482b" stroke="none"/>
    <!-- ears, behind the head -->
    <path d="M21 15 Q11 20 13 31 Q17 35 22 30 Z"/>
    <path d="M43 15 Q53 20 51 31 Q47 35 42 30 Z"/>
    <!-- head: a curly coat, twelve tufts -->
    <path d="M45 21 Q47.9 25.3 43.3 27.5 Q43.7 32.7 38.5 32.3 Q36.3 36.9 32 34 Q27.7 36.9 25.5 32.3 Q20.3 32.7 20.7 27.5 Q16.1 25.3 19 21 Q16.1 16.7 20.7 14.5 Q20.3 9.3 25.5 9.7 Q27.7 5.1 32 8 Q36.3 5.1 38.5 9.7 Q43.7 9.3 43.3 14.5 Q47.9 16.7 45 21 Z"/>
    <!-- a tuft on top -->
    <path d="M28 9 q2 -4 4 -1 q2 -3 4 1" fill="none" stroke-width="1.5"/>
    <!-- eyes, nose, mouth -->
    <!-- eyes, big enough to see at icon size (Mark: "and eyes please") --><ellipse cx="26.6" cy="18.6" rx="3" ry="3.3" fill="#fff" stroke="#000" stroke-width="1.4"/><ellipse cx="37.4" cy="18.6" rx="3" ry="3.3" fill="#fff" stroke="#000" stroke-width="1.4"/><circle cx="27.1" cy="19.3" r="1.8" fill="#000" stroke="none"/><circle cx="36.9" cy="19.3" r="1.8" fill="#000" stroke="none"/><circle cx="27.8" cy="18.5" r=".6" fill="#fff" stroke="none"/><circle cx="37.6" cy="18.5" r=".6" fill="#fff" stroke="none"/>
    <path d="M28.4 23.6 Q32 22.4 35.6 23.6 Q35.2 27 32 28.4 Q28.8 27 28.4 23.6 Z" fill="#000"/>
    <path d="M32 28 v2 M29.5 30.5 q2.5 2.2 5 0" fill="none" stroke-width="1.5"/>
    <!-- the tongue, hanging out (Mark 15 Nov: "make sure peaches has a nose and tongue hanging out") -->
    <path d="M30.3 31.2 Q30.1 37.2 32.4 37.4 Q34.6 37.2 34.2 31.4 Q32.3 32.6 30.3 31.2 Z" fill="#ff6f8a" stroke="#000" stroke-width="1.4"/>
    <path d="M32.3 32.4 V35.6" fill="none" stroke="#c23a55" stroke-width="1"/>
  </g>
</svg>
